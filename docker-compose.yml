version: '3.8'

services:
  api-gateway:
    build:
      context: ./Services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      - authentication
    restart: unless-stopped

  authentication:
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:5006/health?ready=1 || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s
    environment:
      - MONGO_URI=mongodb://admin:secret@mongo:27017/authdb?authSource=admin
    build:
      context: ./Services/Authentication
      dockerfile: Dockerfile
    ports:
      - "${AUTH_PORT:-5006}:5006"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  register:
    build:
      context: ./Services/Register-Service
      dockerfile: Dockerfile
    ports:
      - "${REGISTER_PORT:-5007}:5007"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://admin:secret@rabbitmq:5672
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./Services:/app/Services
    working_dir: /app/Services/Register-Service
    restart: unless-stopped

  target:
    build:
      context: ./Services/Target-Service
      dockerfile: Dockerfile
    ports:
      - "${TARGET_PORT:-5005}:5005"
    env_file:
      - .env
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://admin:secret@mongo:27017/targetdb?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads # Persist uploaded files
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - "5672:5672"   # AMQP protocol (for services)
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret

  mongo:
    image: mongo:latest
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq_data:
  mongodb_data: